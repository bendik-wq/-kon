<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSM122 Bedriftsøkonomi</title>
<meta name="description" content="Formelark, moduler og notater for HSM122 Innføring i bedriftsøkonomi.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --card-2:#fbfbfd; --text:#1d1d1f; --muted:#6e6e73; --faint:#86868b;
  --line:rgba(0,0,0,.08); --accent:#0071e3; --accent-soft:rgba(0,113,227,.09);
  --green:#28cd41; --nav:rgba(245,245,247,.72); --shadow:0 2px 8px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.06);
  --grad:linear-gradient(90deg,#0071e3 0%,#8e44ec 50%,#e8457c 100%);
  --radius:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --card-2:#161618; --text:#f5f5f7; --muted:#a1a1a6; --faint:#8e8e93;
    --line:rgba(255,255,255,.1); --accent:#2997ff; --accent-soft:rgba(41,151,255,.14);
    --nav:rgba(22,22,23,.72); --shadow:0 0 0 1px rgba(255,255,255,.06);
    --grad:linear-gradient(90deg,#2997ff 0%,#a970ff 50%,#ff6b9a 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --card-2:#161618; --text:#f5f5f7; --muted:#a1a1a6; --faint:#8e8e93;
  --line:rgba(255,255,255,.1); --accent:#2997ff; --accent-soft:rgba(41,151,255,.14);
  --nav:rgba(22,22,23,.72); --shadow:0 0 0 1px rgba(255,255,255,.06);
  --grad:linear-gradient(90deg,#2997ff 0%,#a970ff 50%,#ff6b9a 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:17px;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.brand-dot{width:22px;height:22px;border-radius:7px;background:var(--grad)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{font-size:14px;color:var(--muted);padding:6px 14px;border-radius:999px;font-weight:500}
.tab:hover{color:var(--text);text-decoration:none}
.tab.active{color:var(--text);background:var(--accent-soft)}
.theme-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px;border-radius:999px;line-height:1}
.theme-btn:hover{color:var(--text)}

main{max-width:1080px;margin:0 auto;padding:0 16px 120px}

/* Hero */
.hero{text-align:center;padding:72px 0 40px}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:0 0 10px}
.hero h1{font-size:clamp(40px,7vw,80px);line-height:1.04;font-weight:800;letter-spacing:-.045em;margin:0}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(17px,2.2vw,22px);color:var(--muted);max-width:640px;margin:18px auto 0;font-weight:500;letter-spacing:-.015em}

.cta{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-size:17px;font-weight:500;
  padding:12px 24px;border-radius:999px;transition:transform .2s,filter .2s}
.btn:hover{text-decoration:none;filter:brightness(1.08);transform:scale(1.02)}
.cta-note{font-size:13px;color:var(--faint)}

/* Search */
.search-wrap{position:sticky;top:52px;z-index:40;padding:14px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.search{position:relative;max-width:640px;margin:0 auto}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;font-size:16px;padding:0 44px 0 46px;outline:none;box-shadow:var(--shadow);transition:box-shadow .2s}
.search input:focus{box-shadow:0 0 0 4px var(--accent-soft),var(--shadow);border-color:var(--accent)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:12px/1 inherit;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:var(--card);
  color:var(--text);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.chip:hover{text-decoration:none;border-color:var(--accent);color:var(--accent)}
.legend{max-width:760px;margin:6px auto 0;text-align:center;font-size:13px;color:var(--faint)}

/* Formula sections */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px}
.section td{overflow-wrap:anywhere}
.section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 28px 22px;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.section-num{font-size:13px;font-weight:700;color:#fff;background:var(--grad);border-radius:8px;padding:3px 9px;flex:none}
.section h2{font-size:28px;letter-spacing:-.03em;margin:0;font-weight:700}
.section h3{font-size:17px;margin:26px 0 8px;font-weight:600;color:var(--text)}
.section p{margin:10px 0;color:var(--text)}
.section table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
.section th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line)}
.section td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.section tr:last-child td{border-bottom:0}
.section td:first-child{font-weight:600;width:38%;color:var(--text)}
.section td:nth-child(2){font-variant-numeric:tabular-nums;color:var(--text)}
.section tbody tr{transition:background .15s}
.section tbody tr:hover{background:var(--card-2)}
.section table.kalkyle td:first-child{width:50%;font-weight:400}
.section table.kalkyle td{font-weight:400}
.section pre{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow-x:auto;
  font:14px/1.7 "SF Mono",ui-monospace,Menlo,Consolas,monospace;margin:10px 0}
.section code{font:0.92em "SF Mono",ui-monospace,Menlo,Consolas,monospace;background:var(--accent-soft);padding:1px 6px;border-radius:6px}
.section pre code{background:none;padding:0}
.section blockquote{margin:16px 0 4px;padding:14px 18px 14px 44px;background:var(--accent-soft);border-radius:14px;
  position:relative;color:var(--text);font-size:15px}
.section blockquote::before{content:"";position:absolute;left:16px;top:17px;width:16px;height:16px;border-radius:50%;
  background:var(--accent);-webkit-mask:radial-gradient(circle at 50% 30%,#000 1.6px,transparent 2px),linear-gradient(#000,#000) 50% 72%/2px 6px no-repeat;
  mask:radial-gradient(circle at 50% 30%,#000 1.6px,transparent 2px),linear-gradient(#000,#000) 50% 72%/2px 6px no-repeat;opacity:.95}
.section blockquote p{margin:4px 0}
.section.extra{background:transparent;box-shadow:none;border:1px dashed var(--line)}
mark{background:rgba(255,214,10,.45);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:17px}
.hidden{display:none!important}

/* Modules */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:8px}
.mod-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;color:var(--text);
  display:flex;flex-direction:column;gap:14px;min-height:220px;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.mod-card:hover{transform:translateY(-4px) scale(1.01);text-decoration:none}
.mod-card .k{font-size:13px;font-weight:600;color:var(--muted)}
.mod-card h3{font-size:24px;line-height:1.15;letter-spacing:-.03em;margin:0;font-weight:700}
.mod-card .foot{margin-top:auto;display:flex;align-items:center;gap:14px}
.ring{--p:0;width:46px;height:46px;border-radius:50%;flex:none;
  background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring::after{content:"";width:36px;height:36px;border-radius:50%;background:var(--card)}
.ring-wrap{position:relative}
.ring-wrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.mod-card .meta{font-size:14px;color:var(--muted)}
.mod-card .go{margin-left:auto;font-size:15px;font-weight:500;color:var(--accent)}

.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;margin:28px 0 0;font-weight:500}
.mod-hero{padding:24px 0 28px}
.mod-hero .eyebrow{text-align:left}
.mod-hero h1{font-size:clamp(34px,5.5vw,56px);line-height:1.06;letter-spacing:-.04em;margin:0;font-weight:800}
.progress-bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:22px;max-width:420px}
.progress-bar div{height:100%;background:var(--green);border-radius:999px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.progress-label{font-size:14px;color:var(--muted);margin-top:8px}
.section ul{padding-left:20px;margin:8px 0}
.section li{margin:6px 0}
.section ul.tasks{list-style:none;padding:0}
.section ul.tasks li{margin:0;border-bottom:1px solid var(--line)}
.section ul.tasks li:last-child{border-bottom:0}
.section ul.tasks label{display:flex;align-items:center;gap:14px;padding:12px 4px;cursor:pointer}
.section ul.tasks input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--faint);margin:0;flex:none;display:grid;place-items:center;cursor:pointer;transition:all .2s}
.section ul.tasks input:checked{background:var(--green);border-color:var(--green)}
.section ul.tasks input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.section ul.tasks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}

footer{text-align:center;color:var(--faint);font-size:12px;padding:40px 16px}

@media (max-width:640px){
  .tabs .tab{padding:6px 10px}
  .hero{padding:48px 0 28px}
  .section{padding:22px 18px 16px;border-radius:18px}
  .section h2{font-size:23px}
  .section table,.section tbody,.section tr,.section td{display:block;width:100%}
  .section thead{display:none}
  .section td{padding:2px 0;border:0}
  .section td:first-child{width:auto;padding-top:12px;font-size:14px;color:var(--muted)}
  .section tr{border-bottom:1px solid var(--line);padding-bottom:12px}
  .section tr:last-child{border-bottom:0}
  .section table.kalkyle tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 0}
  .section table.kalkyle td:first-child{padding-top:0;color:var(--text)}
  .search kbd{display:none}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="#formler"><span class="brand-dot"></span>HSM122</a>
    <div class="tabs">
      <a class="tab" data-tab="formler" href="#formler">Formler</a>
      <a class="tab" data-tab="moduler" href="#moduler">Moduler</a>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Bytt lys/mørk modus" title="Bytt lys/mørk modus">◐</button>
  </div>
</nav>
<main id="app"></main>
<footer>HSM122 Innføring i bedriftsøkonomi · Formler fra offisielt formelark H25</footer>

<script>
const MODULES = [
  { n: 1, title: 'Introduksjon', path: 'bedriftsregnskap/modul-01-introduksjon/' },
  { n: 2, title: 'Inntekts- og kostnadsbegreper', path: 'bedriftsregnskap/modul-02-inntekts-og-kostnadsbegreper/' },
];

const app = document.getElementById('app');
const cache = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// Theme toggle
(function () {
  const t = store.get('hsm122:theme');
  if (t) document.documentElement.dataset.theme = t;
  document.getElementById('themeBtn').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('hsm122:theme', next);
  };
})();

async function load(path) {
  if (!cache[path]) {
    cache[path] = fetch(path).then(r => {
      if (!r.ok) throw new Error(path + ': ' + r.status);
      return r.text();
    });
  }
  return cache[path];
}

function md(src) {
  const div = document.createElement('div');
  div.innerHTML = marked.parse(src, { gfm: true });
  // Internal links to markdown files → app routes
  div.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/formelark\.md/.test(h)) a.setAttribute('href', '#formler');
    else { const m = h.match(/modul-0?(\d+)/); if (m && !/^https?:/.test(h)) a.setAttribute('href', '#modul-' + m[1]); }
  });
  return div;
}

// Split rendered markdown into cards at each <h2>
function toSections(div) {
  const sections = [];
  let cur = null;
  [...div.children].forEach(el => {
    if (el.tagName === 'H1') return;
    if (el.tagName === 'H2') { cur = { title: el.textContent, nodes: [] }; sections.push(cur); return; }
    if (el.tagName === 'HR') return;
    if (!cur) { cur = { title: null, nodes: [] }; sections.push(cur); }
    cur.nodes.push(el);
  });
  return sections;
}

function setTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---------- Formler ---------- */
async function renderFormler() {
  setTab('formler');
  app.innerHTML = `
    <section class="hero">
      <p class="eyebrow">HSM122 · Innføring i bedriftsøkonomi</p>
      <h1>Alle formlene.<br><span class="grad">Ett sted.</span></h1>
      <p class="lead">Hele formelarket, ordnet etter tema – fra avanse og avskrivninger til standardkost og ABC.</p>
      <div class="cta">
        <a class="btn" href="eksempler/HSM122_eksempeloppgaver.xlsx" download>Last ned eksempeloppgaver</a>
        <span class="cta-note">Excel · løste oppgaver for alle 10 temaene</span>
      </div>
    </section>
    <div class="search-wrap">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Søk – f.eks. dekningspunkt, avvik, saldo" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"><div class="empty">Laster formler…</div></div>
    <div class="empty hidden" id="none">Ingen formler matcher søket.</div>`;

  let src;
  try { src = await load('formelark.md'); }
  catch (e) { document.getElementById('grid').innerHTML = '<div class="empty">Kunne ikke laste formelark.md</div>'; return; }

  const sections = toSections(md(src));
  const grid = document.getElementById('grid');
  const chips = document.getElementById('chips');
  grid.innerHTML = '';

  sections.forEach((s, i) => {
    if (!s.title) {
      // Intro: show the abbreviation legend under the search bar
      const legend = s.nodes.map(n => n.textContent).join(' ').replace(/.*?Forkortelser:/s, 'Forkortelser:');
      const p = document.createElement('p'); p.className = 'legend'; p.textContent = legend;
      document.querySelector('.search-wrap').after(p);
      return;
    }
    const m = s.title.match(/^(\d+)\.\s*(.*)$/);
    const num = m ? m[1] : null;
    const title = m ? m[2] : s.title;
    const card = document.createElement('section');
    card.className = 'section' + (num ? '' : ' extra');
    card.id = slug(title);
    card.style.animationDelay = Math.min(i * 40, 400) + 'ms';
    card.innerHTML = `<div class="section-head">${num ? `<span class="section-num">${num}</span>` : ''}<h2></h2></div>`;
    card.querySelector('h2').textContent = title;
    s.nodes.forEach(n => card.appendChild(n));
    card.querySelectorAll('table').forEach(t => {
      if (/kalkyle/i.test(t.querySelector('th')?.textContent || '')) t.classList.add('kalkyle');
    });
    grid.appendChild(card);

    const chip = document.createElement('a');
    chip.className = 'chip'; chip.textContent = (num ? num + '  ' : '') + title.replace(/\s*\(.*\)/, '');
    chip.onclick = e => { e.preventDefault(); card.scrollIntoView({ behavior: 'smooth' }); };
    chips.appendChild(chip);
  });

  // Snapshot original HTML of every searchable unit for highlight/reset
  const units = [...grid.querySelectorAll('tbody tr, pre, blockquote, .section > p')];
  units.forEach(u => (u._html = u.innerHTML));

  const q = document.getElementById('q');
  const run = () => {
    const term = norm(q.value.trim());
    let any = false;
    grid.querySelectorAll('.section').forEach(sec => {
      const headHit = term && norm(sec.querySelector('h2').textContent).includes(term);
      let hits = 0;
      sec.querySelectorAll('tbody tr, pre, blockquote, .section > p').forEach(u => {
        u.innerHTML = u._html;
        const hit = !term || headHit || norm(u.textContent).includes(term);
        u.classList.toggle('hidden', !hit);
        if (hit) hits++;
        if (term && hit && !headHit) highlight(u, term);
      });
      // Hide tables/sub-headings left with no visible rows
      sec.querySelectorAll('table').forEach(t => t.classList.toggle('hidden', !t.querySelector('tbody tr:not(.hidden)')));
      sec.querySelectorAll('h3').forEach(h => {
        let n = h.nextElementSibling, vis = false;
        while (n && n.tagName !== 'H3') { if (!n.classList.contains('hidden')) vis = true; n = n.nextElementSibling; }
        h.classList.toggle('hidden', !vis);
      });
      const show = !term || headHit || hits > 0;
      sec.classList.toggle('hidden', !show);
      if (show) any = true;
    });
    document.getElementById('none').classList.toggle('hidden', any);
  };
  q.addEventListener('input', run);
  document.onkeydown = e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; run(); q.blur(); }
  };
}

function highlight(root, term) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.nodeValue, n = norm(text), i = n.indexOf(term);
    if (i < 0) return;
    const mark = document.createElement('mark');
    const after = node.splitText(i);
    after.splitText(term.length);
    mark.textContent = after.nodeValue;
    after.replaceWith(mark);
  });
}

/* ---------- Moduler ---------- */
function progressOf(n, total) {
  let done = 0;
  for (let i = 0; i < total; i++) if (store.get(`hsm122:m${n}:${i}`) === '1') done++;
  return done;
}
const countTasks = src => (src.match(/^\s*- \[[ xX]\]/gm) || []).length;

async function renderModuler() {
  setTab('moduler');
  app.innerHTML = `
    <section class="hero">
      <p class="eyebrow">Pensum</p>
      <h1>Modul for modul.</h1>
      <p class="lead">Huk av videoer, PDF-er og quizer etter hvert. Fremdriften lagres i nettleseren din.</p>
    </section>
    <div class="mod-grid" id="mods"></div>`;
  const wrap = document.getElementById('mods');
  for (const [i, m] of MODULES.entries()) {
    let total = 0;
    try { total = countTasks(await load(m.path + 'README.md')); } catch (e) {}
    const done = progressOf(m.n, total);
    const pct = total ? Math.round((done / total) * 100) : 0;
    const a = document.createElement('a');
    a.className = 'mod-card'; a.href = '#modul-' + m.n; a.style.animationDelay = i * 60 + 'ms';
    a.innerHTML = `
      <div class="k">Modul ${m.n}</div>
      <h3></h3>
      <div class="foot">
        <div class="ring-wrap"><div class="ring" style="--p:${pct}"></div><span>${pct}%</span></div>
        <div class="meta">${done} av ${total} fullført</div>
        <div class="go">Åpne ›</div>
      </div>`;
    a.querySelector('h3').textContent = m.title;
    wrap.appendChild(a);
  }
}

async function renderModul(n) {
  setTab('moduler');
  const m = MODULES.find(x => x.n === n);
  if (!m) return renderModuler();
  app.innerHTML = `
    <a class="back" href="#moduler">‹ Alle moduler</a>
    <section class="mod-hero">
      <p class="eyebrow">Modul ${m.n}</p>
      <h1></h1>
      <div class="progress-bar"><div id="pbar" style="width:0"></div></div>
      <div class="progress-label" id="plabel"></div>
    </section>
    <div class="grid" id="grid"></div>`;
  app.querySelector('.mod-hero h1').textContent = m.title;

  const grid = document.getElementById('grid');
  let src = '';
  try { src = await load(m.path + 'README.md'); } catch (e) { grid.innerHTML = '<div class="empty">Kunne ikke laste modulen.</div>'; return; }
  let notes = '';
  try { notes = await load(m.path + 'notater.md'); } catch (e) {}

  const sections = toSections(md(src));
  // Only show notes once something beyond the empty template has been written
  const notesDiv = md(notes.replace(/^# .*\n/, ''));
  const written = [...notesDiv.children].some(el => !/^H\d$/.test(el.tagName) && el.textContent.replace(/[-\s]/g, ''));
  if (written) sections.push({ title: 'Mine notater', nodes: [...notesDiv.children] });

  let taskIdx = 0;
  const boxes = [];
  sections.forEach((s, i) => {
    const card = document.createElement('section');
    card.className = 'section';
    card.style.animationDelay = Math.min(i * 40, 400) + 'ms';
    if (s.title) {
      card.innerHTML = '<div class="section-head"><h2></h2></div>';
      card.querySelector('h2').textContent = s.title;
    }
    s.nodes.forEach(nd => card.appendChild(nd));
    // Interactive checklists
    card.querySelectorAll('ul').forEach(ul => {
      const items = [...ul.children].filter(li => li.querySelector('input[type=checkbox]'));
      if (!items.length) return;
      ul.classList.add('tasks');
      items.forEach(li => {
        const idx = taskIdx++;
        const key = `hsm122:m${m.n}:${idx}`;
        const cb = li.querySelector('input');
        cb.remove();
        const text = li.innerHTML.trim();
        li.innerHTML = '';
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = store.get(key) === '1';
        input.onchange = () => { store.set(key, input.checked ? '1' : '0'); update(); };
        const span = document.createElement('span');
        span.innerHTML = text;
        label.append(input, span);
        li.appendChild(label);
        boxes.push(input);
      });
    });
    // Skip empty placeholder sections (only "-")
    if (s.title && card.textContent.replace(s.title, '').replace(/[-\s]/g, '') === '') return;
    grid.appendChild(card);
  });

  function update() {
    const done = boxes.filter(b => b.checked).length;
    const pct = boxes.length ? Math.round((done / boxes.length) * 100) : 0;
    document.getElementById('pbar').style.width = pct + '%';
    document.getElementById('plabel').textContent = `${done} av ${boxes.length} fullført`;
  }
  update();
}

/* ---------- Router ---------- */
function route() {
  const h = location.hash.replace('#', '');
  window.scrollTo(0, 0);
  const mm = h.match(/^modul-(\d+)$/);
  if (mm) return renderModul(+mm[1]);
  if (h === 'moduler') return renderModuler();
  return renderFormler();
}
window.addEventListener('hashchange', route);
route();
</script>
